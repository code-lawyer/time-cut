[package]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
name = "Lap"
version = "0.1.0-preview.42"
description = "An offline-first photo manager for large local libraries."
homepage = "https://github.com/code-lawyer/time-cut"
repository = "https://github.com/code-lawyer/time-cut"
authors = ["julyx10 <tiangle@gmail.com>"]
edition = "2024"
license = "GPL-3.0-or-later"
build = "build.rs"

[build-dependencies]
cc = "1"
pkg-config = "0.3"
tauri-build = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 3

[dependencies]
drag = { path = "vendor/drag" }
tauri = { version = "2.11.1", features = [
    "macos-private-api",
    "protocol-asset",
    "tray-icon",
] }
tauri-plugin-window-state = "2.4.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-os = "2.3.2"
tauri-plugin-fs = "2.4.5"
tauri-plugin-dialog = "2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.42.0"
plist = "1.10.4"
memmap2 = "0.9"
rusqlite = { version = "0.43", features = ["bundled", "collation", "fallible_uint"] }
chrono = "0.4"
rstar = "0.14"
csv = "1"
dirs = "5.0.1"
walkdir = "2.5.0"
trash = "3.3.1"
base64 = "0.22.1"
flate2 = "1"
http = "1"
image = "0.25.10"
png = "0.18.1"
kamadak-exif = "0.6.1"
little_exif = { version = "=0.6.23", path = "vendor/little_exif" }
exiftool-rs = { version = "=1.0.0", default-features = false }
fast_image_resize = "5.1.0"
imagesize = "0.13.0"
tokio = { version = "1.50.0", features = ["full"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
opener = "0.7.2"
arboard = "3.6.1"
pinyin = "0.10.0"
once_cell = "1.21.4"
rand = "0.8"
ort = { version = "=2.0.0-rc.10", default-features = false, features = [
    "std",
    "ndarray",
    "download-binaries",
    "copy-dylibs",
] }
ndarray = "0.16"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
uuid = { version = "1", features = ["v4"] }
blake3 = "1.8.3"
sha1 = "0.10"
sha2 = "0.10"
zip = { version = "9.8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
jxl-oxide = { version = "0.12.6", features = ["image"] }
libc = "0.2"
hnsw_rs = "0.3.4"
tauri-utils = "2"
percent-encoding = "2.3.1"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
xattr = "1.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSScreen", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSDictionary", "NSError", "NSLocale", "NSString", "NSURL"] }

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5.4.1"
idevice = { version = "=0.1.68", default-features = false, features = ["usbmuxd", "afc", "ring"] }
tauri-plugin-single-instance = "2"
windows = { version = "0.61.3", default-features = false, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Globalization", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Win32_Devices_PortableDevices", "Win32_Devices_DeviceAndDriverInstallation", "Win32_System_Com_StructuredStorage", "Win32_System_Power", "Win32_System_Threading", "Win32_System_Variant"] }
windows-core = "0.61.2"

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]
