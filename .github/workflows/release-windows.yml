name: Time-cut Windows x64

on:
  pull_request:
  push:
    tags: ['timecut-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022
      ORT_PREFER_DYNAMIC_LINK: '1'
      LAP_JPEG_NO_SIMD: '1'
      __CARGO_TEMPORARY_BUILD_DIR_NEW_LAYOUT_OPT_OUT: '1'
      VITE_TIMECUT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - id: version
        name: Verify source and version
        run: |
          $version = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "timecut-v$version") { throw 'Tag and app version differ.' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Prepare native dependencies
        run: |
          python -m pip install cmake==3.31.6
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -c "import cmake;print(cmake.CMAKE_BIN_DIR)" >> $env:GITHUB_PATH
          $ort = Join-Path $env:RUNNER_TEMP 'timecut-ort'
          ./scripts/prepare_windows_ort.ps1 -Destination $ort
          "ORT_LIB_LOCATION=$ort" >> $env:GITHUB_ENV
          "$ort" >> $env:GITHUB_PATH
          ./scripts/download_ffmpeg_sidecar.ps1 -Arch x64
          ./scripts/download_models.ps1
      - name: Build and test frontend
        working-directory: src-vite
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --experimental-vm-modules --test "tests/*.test.mjs" "tests/*.test.ts"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm build
      - name: Build and test the bundled browser demo
        run: |
          node docs/scripts/build-native-demo.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --experimental-vm-modules --test "docs/tests/*.test.mjs"
      - name: Build and test native backend
        run: |
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $artifacts = cargo test --locked --release --manifest-path src-tauri/Cargo.toml --no-run --message-format=json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $tests = @($artifacts | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object {
            $_.reason -eq 'compiler-artifact' -and $_.profile.test -and $_.target.name -eq 'Lap' -and $_.executable
          })
          if ($tests.Count -ne 1) { throw 'Expected the native Lap test executable.' }
          python scripts/test_timecut_compat.py $tests[0].executable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --release --manifest-path src-tauri/Cargo.toml
      - name: Validate portable ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/package_timecut_windows.ps1
          $label = "Time-cut-$env:VERSION-windows-x64"
          $archive = "release-test/$label.zip"
          $unpacked = Join-Path $env:RUNNER_TEMP 'timecut-package-test'
          Expand-Archive -LiteralPath $archive -DestinationPath $unpacked
          $expected = ((Get-Content -Raw "$archive.sha256") -split '\s+')[0]
          if ((Get-FileHash -LiteralPath $archive).Hash -ne $expected) { throw 'ZIP hash differs.' }
          $binary = Join-Path $unpacked "$label/Time-cut.exe"
          $info = Get-Content -Raw (Join-Path $unpacked "$label/BUILD-INFO.json") | ConvertFrom-Json
          if ($info.commit -cne $env:GITHUB_SHA -or $info.workingTreeModified -or $info.executableSHA256 -ne (Get-FileHash $binary).Hash) { throw 'Source or binary identity differs.' }
          node scripts/test_timecut_recovery.mjs $binary
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/test_timecut_desktop.mjs $binary
      - uses: actions/upload-artifact@v4
        with:
          name: timecut-windows-x64
          path: |
            release-test/Time-cut-*-windows-x64.zip
            release-test/Time-cut-*-windows-x64.zip.sha256
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: portable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: timecut-windows-x64
          path: assets
      - name: Verify release files
        working-directory: assets
        run: sha256sum -c ./*.sha256
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(needs.portable.outputs.version, '-') }}
          files: |
            assets/*.zip
            assets/*.zip.sha256
          fail_on_unmatched_files: true
